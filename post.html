<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 · 我的博客</title>
  <meta name="description" content="文章正文。">

  <meta name="theme-color" content="#fdfdfc">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="article">
  <meta property="og:title" content="文章 · 我的博客">
  <meta property="og:description" content="文章正文。">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f4e'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%E7%99%BD%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/style.css">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('blog-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header"></header>

  <main id="main" class="container" style="padding-top:32px">
    <!-- 文章头部：标题、日期、标签（js/post.js 注入） -->
    <div class="post-header" id="post-header"></div>

    <!-- 正文 -->
    <article class="prose" id="post-body">
      <p>正在加载…</p>
    </article>

    <!-- 底部：标签、相邻文章 -->
    <div class="post-footer" id="post-footer"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="data/posts.js"></script>
  <script src="js/main.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
