<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全部文章 · Marcus's blog</title>
  <meta name="description" content="按时间和标签浏览全部文章。">

  <meta name="theme-color" content="#fdfdfc">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="全部文章 · Marcus's blog">
  <meta property="og:description" content="按时间和标签浏览全部文章。">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f4e'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%E7%99%BD%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/style.css">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('blog-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="container" style="padding-top:56px">
      <div class="page-header" style="padding-top:0">
        <h1 class="page-header__title">全部文章</h1>
        <p class="page-header__lead" id="result-count">加载中…</p>
      </div>

      <!-- 搜索 -->
      <form id="search-form" role="search" style="display:flex;gap:8px;margin-bottom:16px">
        <label class="sr-only" for="search-input">搜索文章</label>
        <input id="search-input" type="search" name="q" placeholder="搜索标题、摘要或标签…"
               style="flex:1;padding:10px 14px;font:inherit;font-size:.9375rem;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px">
        <button id="search-clear" type="button" class="filter-btn" hidden>清空</button>
        <button type="submit" class="filter-btn">搜索</button>
      </form>

      <!-- 标签筛选 -->
      <div class="filter-bar" id="filter-bar" role="group" aria-label="按标签筛选"></div>

      <!-- 文章列表 -->
      <ul class="post-list" id="post-list">
        <!-- js/posts.js 注入 -->
      </ul>

      <!-- 分页 -->
      <nav class="pagination" id="pagination" aria-label="分页导航"></nav>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="data/posts.js"></script>
  <script src="js/main.js"></script>
  <script src="js/posts.js"></script>
</body>
</html>
