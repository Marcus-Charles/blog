<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · Marcus's blog</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fdfdfc">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f4e'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%E7%99%BD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('blog-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <style>
    .e404 { max-width: 480px; margin: 18vh auto; text-align: center; padding: 0 24px; }
    .e404__code { font-size: 5rem; font-weight: 800; color: var(--accent); line-height: 1; margin: 0; }
    .e404__title { font-size: 1.375rem; margin: 12px 0 8px; }
    .e404__text { color: var(--text-muted); margin-bottom: 28px; }
    .e404__btn {
      display: inline-block; padding: 10px 22px; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: .9375rem; font-weight: 500;
    }
    .e404__btn:hover { text-decoration: none; opacity: .9; }
  </style>
</head>
<body>
  <main class="e404">
    <p class="e404__code">404</p>
    <h1 class="e404__title">这个页面走丢了</h1>
    <p class="e404__text">你访问的地址不存在，可能是链接过期，或者我重新整理过文件。</p>
    <a class="e404__btn" href="/">回到首页</a>
  </main>
</body>
</html>
